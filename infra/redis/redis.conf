# Redis config for SCHISM V2.0
# Streams are the primary transport layer — tune for throughput + durability.

# --- Memory ---
# Cap at 512 MB. allkeys-lru evicts the least-recently-used key when full.
# Streams are ephemeral transport; Postgres is the durable store.
maxmemory 512mb
maxmemory-policy allkeys-lru

# --- Streams ---
# Default max entries per stream. Services can override per-stream with XADD MAXLEN.
# 50_000 bars × 5 streams ≈ 250k entries total — well within the memory cap.
stream-node-max-bytes 4096
stream-node-max-entries 128

# --- Persistence ---
# RDB snapshot for crash recovery (not required for correctness — Postgres is canonical).
save 900 1
save 300 10
save 60  10000

# AOF disabled — streams are ephemeral, RDB is sufficient.
appendonly no

# --- Networking ---
bind 0.0.0.0
protected-mode no
